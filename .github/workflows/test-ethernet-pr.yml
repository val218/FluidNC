name: Test build - Ethernet PR (ESP32-S3)

# Builds the ethernet-only-network-services PR on top of main, for testing on
# hardware before review. Lives only on this test branch, not in the PR.
on:
  push:
    branches: [ test-ethernet-pr ]
  workflow_dispatch:

permissions:
  contents: write   # publish the "ethernet-pr-test" pre-release (plain downloads)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-version.py needs history

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --upgrade platformio

      - name: Build firmware (wifi_s3)
        shell: bash
        run: |
          set -o pipefail
          pio run -e wifi_s3 2>&1 | tee build.log || {
            grep -E "error|undefined|multiple definition" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Build merged flash image
        run: pio run -e wifi_s3 -t build_merged

      - name: Collect binaries
        run: |
          mkdir -p out
          B=.pio/build/wifi_s3
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin out/
          cp $B/littlefs.bin out/ 2>/dev/null || true
          cp $B/merged-flash.bin out/ 2>/dev/null || true
          echo "$(git rev-parse --short HEAD) $(git log -1 --format=%s)" > out/version.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ethernet-pr-test-s3-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Publish as pre-release "ethernet-pr-test"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release delete ethernet-pr-test -y --cleanup-tag || true
          gh release create ethernet-pr-test out/* --prerelease --target "$GITHUB_SHA" \
            --title "TEST: Ethernet PR on FluidNC main ($SHORT)" \
            --notes "Test build of the ethernet-only-network-services PR on current FluidNC main, for ESP32-S3 (wifi_s3). Not a release. merged-flash.bin = fresh board at 0x0 (overwrites config.yaml); firmware.bin = update at 0x10000 or via the WebUI."
